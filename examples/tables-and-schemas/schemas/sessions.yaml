# Table schema in YAML: the same fields as a JSON schema file.
- name: session_id
  type: STRING
  mode: REQUIRED
- name: user_id
  type: STRING
- name: started_at
  type: TIMESTAMP
  mode: REQUIRED
- name: duration_seconds
  type: INT64
- name: pages
  type: RECORD
  mode: REPEATED
  fields:
    - name: page
      type: STRING
    - name: seconds_on_page
      type: INT64

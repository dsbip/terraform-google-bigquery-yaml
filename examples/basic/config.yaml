# yaml-language-server: $schema=../../schemas/bigquery-config.schema.json
#
# Basic example: one dataset with two tables and a view.
#
# Datasets, tables and views are separate sections. A table or view is not
# indented under its dataset; it names it with `dataset: <key>`.
#
# Each table takes its schema from a JSON file in schemas/, and the view takes
# its SQL from sql/revenue_by_country.sql.tftpl (paths are relative to this
# file). Files ending in .tftpl are rendered, so the project_id placeholder in
# the SQL becomes the project from the module's project_id variable (main.tf).

defaults:
  location: US
  labels:
    team: analytics
  tables:
    # Examples are meant to be destroyed again; keep the provider default
    # (true) for production data.
    deletion_protection: false

datasets:
  sales:
    friendly_name: Sales
    description: Orders and customers from the web shop.
    delete_contents_on_destroy: true
    access:
      - role: READER
        members:
          - specialGroup:projectReaders

tables:
  customers:
    dataset: sales
    description: One row per customer.
    schema_file: schemas/customers.json

  orders:
    dataset: sales
    description: One row per order, partitioned by order date.
    schema_file: schemas/orders.json
    time_partitioning:
      type: DAY
      field: ordered_at
    clustering: [customer_id]

views:
  revenue_by_country:
    dataset: sales
    description: Revenue per customer country.
    query_file: sql/revenue_by_country.sql.tftpl

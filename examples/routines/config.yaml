# yaml-language-server: $schema=../../schemas/bigquery-config.schema.json
#
# Routines: SQL and JavaScript UDFs, table-valued functions, stored procedures,
# a data-masking function and a remote function backed by Cloud Run.
#
# Data types can be written three ways (see docs/configuration.md#data-types):
#   data_type: STRING                                   (simple type name)
#   data_type: { typeKind: ARRAY, arrayElementType: { typeKind: STRING } }
#   data_type: '{"typeKind": "STRING"}'                 (raw JSON)

defaults:
  location: US
  tables:
    deletion_protection: false
  datasets:
    delete_contents_on_destroy: true

connections:
  # Identity that BigQuery uses to call the remote function endpoint. Grant its
  # service account (output connections.remote.service_account_id) the
  # Cloud Run Invoker role on the service.
  remote:
    friendly_name: Remote functions
    cloud_resource: {}

datasets:
  udfs:
    description: Shared user-defined functions.
    access:
      - role: READER
        members: [specialGroup:projectReaders]

tables:
  orders:
    dataset: udfs
    schema_file: schemas/orders.json

  order_audit:
    dataset: udfs
    schema_file: schemas/order_audit.json

routines:
  # Scalar SQL UDF. routine_type defaults to SCALAR_FUNCTION.
  normalize_email:
    dataset: udfs
    description: Lower-cases and trims an email address.
    language: SQL
    arguments:
      - { name: email, data_type: STRING }
    return_type: STRING
    definition_file: routines/normalize_email.sql

  # Complex types as mappings.
  split_tags:
    dataset: udfs
    description: Splits a comma-separated list into a de-duplicated array.
    language: SQL
    arguments:
      - { name: csv, data_type: STRING }
    return_type:
      typeKind: ARRAY
      arrayElementType: { typeKind: STRING }
    definition_file: routines/split_tags.sql

  order_summary:
    dataset: udfs
    description: Builds a STRUCT from order fields.
    language: SQL
    arguments:
      - { name: order_id, data_type: STRING }
      - { name: amount, data_type: NUMERIC }
    return_type:
      typeKind: STRUCT
      structType:
        fields:
          - { name: id, type: { typeKind: STRING } }
          - { name: amount_usd, type: { typeKind: NUMERIC } }
    definition_file: routines/order_summary.sql

  # JavaScript UDF. The body comes from a file; JavaScript template
  # literals are safe because only *.tftpl files are rendered.
  title_case:
    dataset: udfs
    description: Title-cases a string.
    language: JAVASCRIPT
    determinism_level: DETERMINISTIC
    arguments:
      - { name: s, data_type: STRING }
    return_type: STRING
    definition_file: routines/title_case.js

  # Table-valued function.
  orders_above:
    dataset: udfs
    description: Orders with an amount above a threshold.
    routine_type: TABLE_VALUED_FUNCTION
    arguments:
      - { name: min_amount, data_type: NUMERIC }
    definition_file: routines/orders_above.sql.tftpl
    return_table_type:
      columns:
        - { name: order_id, type: STRING }
        - { name: amount, type: NUMERIC }

  # Stored procedure with IN and OUT arguments, body from a SQL file.
  archive_cancelled_orders:
    dataset: udfs
    description: Deletes cancelled orders and records how many were removed.
    routine_type: PROCEDURE
    language: SQL
    arguments:
      - { name: older_than_days, data_type: INT64, mode: IN }
      - { name: archived, data_type: INT64, mode: OUT }
    definition_file: routines/archive_cancelled_orders.sql.tftpl
    iam:
      - role: roles/bigquery.dataViewer
        members: [group:data-engineers@example.com]

  # Data masking function, usable in column-level masking rules.
  mask_email:
    dataset: udfs
    description: Keeps the domain of an email address.
    language: SQL
    data_governance_type: DATA_MASKING
    arguments:
      - { name: email, data_type: STRING }
    return_type: STRING
    definition_file: routines/mask_email.sql

  # Remote function calling a Cloud Run service through the connection above.
  detect_language:
    dataset: udfs
    description: Detects the language of a text with a Cloud Run service.
    arguments:
      - { name: text, data_type: STRING }
    return_type: STRING
    remote_function_options:
      endpoint: ${language_service_url}
      connection: remote # connection key from this file
      max_batching_rows: 50
      user_defined_context:
        model: fast

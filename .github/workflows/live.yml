# Deploys tests/integration into a real project, checks that a second plan is
# empty, updates in place, and destroys everything again. Runs only on demand.
#
# Setup (repository settings > Secrets and variables > Actions > Variables):
#   BQ_YAML_TEST_PROJECT            project to test in
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   GCP_SERVICE_ACCOUNT             service account with roles/bigquery.admin in the project
#                                   (plus roles/bigquery.connectionAdmin for connections)
name: Live test

on:
  workflow_dispatch:
    inputs:
      location:
        description: BigQuery location
        default: US
      connections:
        description: Also test connections (needs the BigQuery Connection API)
        type: boolean
        default: false
      transfers:
        description: Also test transfers (needs the BigQuery Data Transfer API)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  live:
    runs-on: ubuntu-latest
    if: vars.BQ_YAML_TEST_PROJECT != ''
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/python/requirements.txt
      - run: python -m pytest tests/python/test_live.py -v
        env:
          BQ_YAML_TEST_PROJECT: ${{ vars.BQ_YAML_TEST_PROJECT }}
          BQ_YAML_TEST_LOCATION: ${{ inputs.location }}
          BQ_YAML_TEST_MEMBER: serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}
          BQ_YAML_TEST_CONNECTIONS: ${{ inputs.connections }}
          BQ_YAML_TEST_TRANSFERS: ${{ inputs.transfers }}
